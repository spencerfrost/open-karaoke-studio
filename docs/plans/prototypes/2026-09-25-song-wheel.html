<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song Wheel Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
  /* Single dark world on purpose: this is a TV screen in a dark living room. */
  :root {
    color-scheme: dark;
    --bg: #0a0913;
    --bg-2: #13112a;
    --panel: #171530;
    --line: #2b2752;
    --text: #efeaff;
    --dim: #8d86b3;
    --faint: #4a4570;
    --pink: #ff4fc8;
    --cyan: #4fe3ff;
    --band: rgba(79, 227, 255, 0.10);

    --turn-ms: 320ms;
    --side-bright: 0.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Barlow", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- the TV: a fixed 1600x900 frame scaled to fit ---------- */
  .viewport {
    position: relative;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 55% at 50% 52%, #1d1942 0%, transparent 70%),
      var(--bg);
    outline: none;
  }
  .tv {
    position: absolute;
    left: 50%; top: 50%;
    width: 1600px; height: 900px;
    transform-origin: 50% 50%;
  }

  .topbar {
    position: absolute; left: 64px; right: 64px; top: 40px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 24px;
  }
  .crumbs {
    font-family: "Saira Condensed", sans-serif;
    font-weight: 700; font-size: 30px; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--dim);
    display: flex; gap: 14px; align-items: baseline;
    white-space: nowrap; overflow: hidden;
  }
  .crumbs b { color: var(--text); font-weight: 800; }
  .crumbs .sep { color: var(--faint); }
  .screen-name {
    font-family: "Saira Condensed", sans-serif;
    font-size: 22px; font-weight: 500; letter-spacing: 0.2em;
    text-transform: uppercase; color: var(--faint);
  }

  /* ---------- the cylinder ---------- */
  .stage {
    position: absolute; inset: 110px 0 120px 0;
    perspective: 1700px;
    perspective-origin: 50% 50%;
  }
  .ring {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transition: transform var(--turn-ms) cubic-bezier(.2,.8,.25,1);
  }
  .col {
    position: absolute;
    top: -335px; height: 670px;
    overflow: hidden;
    /* Same duration and easing as the ring, so the counter-rotation that keeps
       the text facing forward stays in step with the turn. */
    transition: transform var(--turn-ms) cubic-bezier(.2,.8,.25,1), opacity var(--turn-ms);
    opacity: var(--side-bright);
    cursor: pointer;
  }
  .col.active {
    opacity: 1;
    cursor: default;
  }
  .col-head {
    position: absolute; left: 0; right: 0; top: 0; z-index: 3;
    padding: 20px 28px 14px;
    font-family: "Saira Condensed", sans-serif;
    text-transform: uppercase; letter-spacing: 0.14em;
    font-size: 18px; font-weight: 700; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .col.songs .col-head { display: flex; align-items: center; gap: 18px; }
  .col.songs .col-head .head-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .col.songs .col-head .artist-name {
    display: block; margin-top: 2px;
    font-size: 40px; letter-spacing: 0.02em; color: var(--text); font-weight: 800;
    overflow: hidden; text-overflow: ellipsis;
  }
  .col.active .col-head { color: var(--cyan); }

  .window {
    position: absolute; left: 0; right: 0; top: 0; bottom: 0;
    -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
  }
  .col.songs .window { top: 96px; }
  body[data-art="head"] .col.songs .window, body[data-art="both"] .col.songs .window { top: 124px; }
  .band {
    position: absolute; left: 10px; right: 10px; top: 50%;
    transform: translateY(-50%);
    /* A soft glow behind the selected row, active column only. No edges. */
    background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(255,79,200,.28), rgba(79,227,255,.08) 60%, transparent 75%);
    opacity: 0;
    transition: opacity var(--turn-ms);
    pointer-events: none;
  }
  .col.active .band { opacity: 1; }
  .col.active .item.cur { text-shadow: 0 0 18px rgba(255,79,200,.7), 0 0 42px rgba(79,227,255,.35); }
  .strip {
    position: absolute; left: 0; right: 0; top: 50%;
    transition: transform var(--scroll-ms, 160ms) cubic-bezier(.2,.8,.25,1);
    will-change: transform;
  }
  .item {
    position: absolute; left: 0; right: 0;
    display: flex; align-items: center;
    padding: 0 28px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: opacity var(--scroll-ms, 160ms), color var(--scroll-ms, 160ms);
  }
  .item span { overflow: hidden; text-overflow: ellipsis; }

  .col.letters .item {
    justify-content: center; padding: 0;
    font-family: "Saira Condensed", sans-serif; font-weight: 800; font-size: 48px;
  }
  .col.letters .item.empty { color: var(--faint); }
  .col.artists .item, .col.songs .item { font-size: 32px; font-weight: 500; }
  .item.cur { color: #fff; font-weight: 600; }
  .col.songs .item .n {
    width: 44px; flex: none;
    font-family: "Saira Condensed", sans-serif; font-size: 22px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }
  .col.artists .item .count {
    margin-left: auto; padding-left: 16px; flex: none;
    font-family: "Saira Condensed", sans-serif; font-size: 22px; color: var(--faint);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- artwork (made-up placeholders standing in for real images) ---------- */
  .art {
    display: grid; place-items: center;
    border-radius: 12px; overflow: hidden;
    background-size: cover;
    font-family: "Saira Condensed", sans-serif; font-weight: 800; font-style: normal; color: var(--dim);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  .art.artist { border-radius: 50%; }
  /* No image found: the fallback every image slot needs. */
  .art.none { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }

  .head-art { display: none; flex: none; width: 84px; height: 84px; font-size: 44px; transition: opacity 200ms; }
  body[data-art="head"] .head-art, body[data-art="both"] .head-art { display: grid; }
  .head-art.pending { opacity: .25; }

  /* Selected-row chip: slides in once the cursor settles, out as soon as it moves. */
  .item .chip {
    flex: none; width: 0; height: 48px; margin-right: 0; opacity: 0;
    font-size: 26px; box-shadow: none;
    transition: width 180ms, margin 180ms, opacity 180ms;
  }
  .item .chip.show { width: 48px; margin-right: 18px; opacity: 1; }

  .backdrop { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 400ms; }
  body.backdrop-on .backdrop { opacity: 1; }
  .backdrop .bd {
    position: absolute; inset: -15%;
    filter: blur(90px) saturate(1.2);
    opacity: 0; transition: opacity 600ms;
  }
  .backdrop .bd.on { opacity: .5; }
  /* Keeps the middle of the screen dark enough for the text. */
  .backdrop::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, rgba(10,9,19,.45), rgba(10,9,19,.9));
  }

  /* ---------- song info card: right side, songs column only ---------- */
  .info {
    position: absolute; right: 56px; top: 460px;
    width: 400px; padding: 24px;
    border-radius: 20px;
    background: linear-gradient(160deg, rgba(28,24,64,.92), rgba(17,15,39,.92));
    box-shadow: 0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.5);
    opacity: 0; transform: translate(24px, -50%);
    transition: opacity 220ms, transform 220ms cubic-bezier(.2,.8,.25,1);
    pointer-events: none;
  }
  body.info-on .info.open { opacity: 1; transform: translate(0, -50%); }
  .info .body { transition: opacity 120ms; }
  .info.pending .body { opacity: .25; }
  .info .hero { position: relative; margin-bottom: 64px; }
  .info .thumb {
    aspect-ratio: 16 / 9; width: 100%; border-radius: 12px;
    font-size: 20px; letter-spacing: .12em; text-transform: uppercase;
  }
  .info .cover {
    position: absolute; left: 18px; bottom: -48px;
    width: 116px; height: 116px; font-size: 56px;
    box-shadow: 0 0 0 4px #1a1740, 0 10px 30px rgba(0,0,0,.5);
  }
  .info h3 {
    margin: 0; font-family: "Saira Condensed", sans-serif; font-weight: 800;
    font-size: 40px; line-height: 1.05; text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .info .who { margin-top: 4px; font-size: 24px; color: var(--text); opacity: .85; }
  .info .album-line { margin-top: 2px; font-size: 20px; color: var(--dim); }
  .info .facts {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--line);
  }
  .info .facts div { min-width: 0; }
  .info dt {
    font-family: "Saira Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .14em; font-size: 14px; color: var(--faint);
  }
  .info dd {
    margin: 2px 0 0; font-family: "Saira Condensed", sans-serif; font-weight: 700;
    font-size: 26px; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info dd.unknown { color: var(--faint); font-weight: 500; }
  .info .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .info .tag {
    padding: 4px 12px; border-radius: 999px;
    font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: 16px;
    letter-spacing: .08em; text-transform: uppercase;
    background: rgba(79,227,255,.12); color: var(--cyan);
  }
  .info .tag.warn { background: rgba(255,79,200,.14); color: var(--pink); }
  .info .tag.dim { background: rgba(141,134,179,.12); color: var(--dim); }

  /* ---------- legend ---------- */
  .legend {
    position: absolute; left: 0; right: 0; bottom: 44px;
    display: flex; justify-content: center; gap: 44px;
    font-size: 22px; color: var(--dim);
  }
  .legend .k { display: flex; align-items: center; gap: 12px; }
  kbd {
    display: inline-grid; place-items: center;
    min-width: 42px; height: 38px; padding: 0 10px;
    border-radius: 8px; border: 1px solid var(--line);
    border-bottom-width: 3px;
    background: var(--panel); color: var(--text);
    font-family: "Saira Condensed", sans-serif; font-size: 20px; font-weight: 700;
  }

  /* ---------- confirm overlay ---------- */
  .confirm {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(6,5,14,.72);
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 180ms;
  }
  .confirm.open { opacity: 1; pointer-events: auto; }
  .card {
    width: 960px; padding: 48px 56px;
    border-radius: 22px; border: 1px solid rgba(255,79,200,.5);
    background: linear-gradient(160deg, #1c1840, #110f27);
    box-shadow: 0 0 80px rgba(255,79,200,.2);
    display: grid; grid-template-columns: 200px 1fr; column-gap: 40px; align-items: center;
  }
  .card .c-art { width: 200px; height: 200px; font-size: 96px; }
  .card .c-text { display: grid; gap: 10px; min-width: 0; }
  .card .eyebrow {
    font-family: "Saira Condensed", sans-serif; text-transform: uppercase;
    letter-spacing: .18em; font-size: 20px; color: var(--dim);
  }
  .card h2 {
    margin: 0; font-family: "Saira Condensed", sans-serif; font-weight: 800;
    font-size: 64px; line-height: 1.02; text-wrap: balance;
  }
  .card .by { font-size: 30px; color: var(--dim); }
  .card .choices { grid-column: 1 / -1; display: flex; gap: 20px; margin-top: 36px; }
  .choice {
    flex: 1; height: 84px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--panel); color: var(--text);
    font-family: "Saira Condensed", sans-serif; font-size: 32px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
  }
  .choice.cur {
    border-color: var(--pink);
    background: linear-gradient(90deg, rgba(255,79,200,.28), rgba(79,227,255,.18));
    box-shadow: 0 0 30px rgba(255,79,200,.35);
  }

  .toast {
    position: absolute; left: 50%; bottom: 120px;
    transform: translate(-50%, 20px);
    padding: 16px 28px; border-radius: 12px;
    background: #fff; color: #120f26;
    font-size: 24px; font-weight: 600;
    opacity: 0; transition: opacity 200ms, transform 200ms;
    pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .focus-hint {
    position: absolute; left: 50%; top: 18px; transform: translateX(-50%);
    padding: 8px 16px; border-radius: 999px;
    background: var(--pink); color: #14061a; font-weight: 600; font-size: 14px;
    z-index: 20; pointer-events: none;
    transition: opacity 200ms;
  }
  .focus-hint.hidden { opacity: 0; }

  /* ---------- tuning panel (real pixels, outside the TV) ---------- */
  .tune-btn {
    position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    border-radius: 999px; padding: 10px 18px;
    font: 600 14px "Barlow", sans-serif; cursor: pointer;
  }
  .tune-btn:focus-visible, .choice:focus-visible, .tune button:focus-visible, .tune input:focus-visible, .tune select:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 2px;
  }
  .tune {
    position: absolute; right: 16px; bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    width: min(320px, calc(100% - 32px));
    padding: 18px 18px 14px;
    border-radius: 14px; border: 1px solid var(--line);
    background: rgba(19,17,42,.97);
    display: none; gap: 14px;
    font-size: 14px;
  }
  .tune.open { display: grid; }
  .tune h3 {
    margin: 0; font: 700 13px "Saira Condensed", sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  }
  .tune label { display: grid; gap: 6px; }
  .tune .row { display: flex; justify-content: space-between; color: var(--dim); }
  .tune .row output { color: var(--text); font-variant-numeric: tabular-nums; }
  .tune select {
    width: 100%; padding: 6px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg-2); color: var(--text); font: inherit;
  }
  .tune .check { display: flex; align-items: center; gap: 8px; color: var(--dim); }
  .tune .check input { accent-color: var(--pink); }
  .tune input[type=range] { width: 100%; accent-color: var(--pink); }
  .tune .foot { display: flex; justify-content: space-between; align-items: center; color: var(--faint); font-size: 12px; }
  .tune .foot button {
    border: 1px solid var(--line); background: transparent; color: var(--text);
    border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring, .strip, .item, .col, .confirm, .toast, .chip, .info, .info .body, .bd, .backdrop, .head-art { transition: none !important; }
  }
</style>
</head>
<body>
<div class="viewport" id="viewport" tabindex="0" aria-label="Song wheel prototype. Use the arrow keys, Enter and Backspace.">
  <div class="focus-hint hidden" id="focusHint">Click the screen so it gets your arrow keys</div>
  <div class="backdrop" aria-hidden="true"><div class="bd"></div><div class="bd"></div></div>

  <div class="tv" id="tv">
    <div class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="screen-name">Pick a song</div>
    </div>

    <div class="stage">
      <div class="ring" id="ring">
        <div class="col letters" data-col="0"><div class="col-head">A–Z</div><div class="window"><div class="band"></div><div class="strip"></div></div></div>
        <div class="col artists" data-col="1"><div class="col-head">Artists</div><div class="window"><div class="band"></div><div class="strip"></div></div></div>
        <div class="col songs" data-col="2"><div class="col-head"><i class="art artist head-art" id="headArt"></i><div class="head-text">Songs<span class="artist-name"></span></div></div><div class="window"><div class="band"></div><div class="strip"></div></div></div>
      </div>
    </div>

    <aside class="info" id="info" aria-live="polite">
      <div class="body">
        <div class="hero">
          <i class="art thumb" id="iThumb"></i>
          <i class="art album cover" id="iCover"></i>
        </div>
        <h3 id="iTitle"></h3>
        <div class="who" id="iArtist"></div>
        <div class="album-line" id="iAlbum"></div>
        <dl class="facts">
          <div><dt>Length</dt><dd id="iLen"></dd></div>
          <div><dt>Range</dt><dd id="iRange"></dd></div>
          <div><dt>Year</dt><dd id="iYear"></dd></div>
        </dl>
        <div class="tags" id="iTags"></div>
      </div>
    </aside>

    <div class="legend" id="legend"></div>

    <div class="confirm" id="confirm">
      <div class="card">
        <i class="art album c-art" id="cArt"></i>
        <div class="c-text">
          <div class="eyebrow">Ready?</div>
          <h2 id="cTitle"></h2>
          <div class="by" id="cArtist"></div>
        </div>
        <div class="choices">
          <button class="choice" data-choice="0" type="button">Sing it now</button>
          <button class="choice" data-choice="1" type="button">Add to queue</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <button class="tune-btn" id="tuneBtn" type="button">Tune the wheel</button>
  <div class="tune" id="tune">
    <h3>Tuning · changes apply live</h3>
    <label for="tGap"><span class="row">Gap between columns <output id="oGap"></output></span><input id="tGap" type="range" min="0" max="400" step="10"></label>
    <label for="tRadius"><span class="row">How far back they sit <output id="oRadius"></output></span><input id="tRadius" type="range" min="500" max="2200" step="20"></label>
    <label for="tTurn"><span class="row">Turn speed <output id="oTurn"></output></span><input id="tTurn" type="range" min="80" max="800" step="10"></label>
    <label for="tSide"><span class="row">Side column brightness <output id="oSide"></output></span><input id="tSide" type="range" min="0.1" max="1" step="0.05"></label>
    <label for="tRamp"><span class="row">Hold-to-scroll top speed <output id="oRamp"></output></span><input id="tRamp" type="range" min="8" max="50" step="1"></label>
    <h3>Artwork</h3>
    <label for="tArt"><span class="row">Where images go</span>
      <select id="tArt">
        <option value="off">Nowhere</option>
        <option value="head">Songs heading (artist)</option>
        <option value="row">Selected row</option>
        <option value="both">Heading and selected row</option>
      </select>
    </label>
    <label class="check" for="tInfo"><input id="tInfo" type="checkbox"> Song info card</label>
    <label class="check" for="tBackdrop"><input id="tBackdrop" type="checkbox"> Blurred backdrop of the selection</label>
    <div class="foot"><span>Sample songs, made-up art. About 1 in 4 has no image.</span><button type="button" id="tReset">Reset</button></div>
  </div>
</div>

<script>
(() => {
  // ---------------- sample library (placeholder data) ----------------
  const RAW = {

    "4 Non Blondes": ["What's Up?"],
    "ABBA": ["Dancing Queen", "Mamma Mia", "Waterloo", "Take a Chance on Me"],

    "Aerosmith": ["I Don't Want to Miss a Thing", "Dream On"],
    "Alanis Morissette": ["Ironic", "You Oughta Know"],
    "Avril Lavigne": ["Complicated", "Sk8er Boi"],
    "The B-52's": ["Love Shack", "Roam"],
    "Backstreet Boys": ["I Want It That Way", "Everybody"],

    "Beyoncé": ["Single Ladies", "Crazy in Love"],

    "Chappell Roan": ["Pink Pony Club", "Good Luck, Babe!"],
    "Cher": ["Believe"],

    "Cyndi Lauper": ["Girls Just Want to Have Fun", "Time After Time"],
    "David Bowie": ["Starman", "Heroes", "Life on Mars?"],
    "Dolly Parton": ["Jolene", "9 to 5"],
    "Don McLean": ["American Pie"],
    "Duran Duran": ["Hungry Like the Wolf"],
    "Elton John": ["Tiny Dancer", "Rocket Man", "Your Song"],
    "Europe": ["The Final Countdown"],
    "Eurythmics": ["Sweet Dreams (Are Made of This)"],
    "Fleetwood Mac": ["Dreams", "Go Your Own Way", "The Chain", "Rhiannon", "Landslide", "Everywhere"],
    "Foo Fighters": ["Everlong", "Learn to Fly", "Best of You"],
    "Franz Ferdinand": ["Take Me Out"],

    "Guns N' Roses": ["Sweet Child o' Mine", "Paradise City"],
    "Hall & Oates": ["You Make My Dreams", "Rich Girl"],
    "Harry Styles": ["As It Was", "Adore You"],
    "Heart": ["Alone", "Barracuda"],
    "Hozier": ["Take Me to Church"],
    "Imagine Dragons": ["Radioactive"],
    "INXS": ["Need You Tonight"],
    "Journey": ["Don't Stop Believin'", "Separate Ways"],
    "Justin Timberlake": ["Cry Me a River", "SexyBack"],
    "Kate Bush": ["Running Up That Hill"],
    "Katy Perry": ["Teenage Dream", "Firework", "I Kissed a Girl"],
    "Kelly Clarkson": ["Since U Been Gone", "Breakaway"],
    "The Killers": ["Mr. Brightside", "Somebody Told Me", "When You Were Young"],
    "Lady Gaga": ["Bad Romance", "Shallow", "Poker Face"],
    "Lizzo": ["Good as Hell", "Juice"],
    "Lorde": ["Royals"],
    "Madonna": ["Like a Prayer", "Material Girl", "Vogue"],
    "Mariah Carey": ["Hero", "Fantasy"],
    "Meat Loaf": ["Paradise by the Dashboard Light", "I'd Do Anything for Love"],
    "Michael Jackson": ["Billie Jean", "Man in the Mirror", "Beat It"],
    "My Chemical Romance": ["Welcome to the Black Parade", "Helena"],
    "Neil Diamond": ["Sweet Caroline"],
    "Nirvana": ["Smells Like Teen Spirit", "Come as You Are"],
    "No Doubt": ["Don't Speak", "Just a Girl"],
    "Oasis": ["Wonderwall", "Don't Look Back in Anger"],
    "Olivia Rodrigo": ["drivers license", "good 4 u"],
    "Outkast": ["Hey Ya!"],
    "P!nk": ["So What", "Just Give Me a Reason"],
    "Panic! at the Disco": ["I Write Sins Not Tragedies"],
    "Paramore": ["Misery Business", "Still Into You"],
    "Prince": ["Purple Rain", "Kiss"],
    "Queen": ["Bohemian Rhapsody", "Don't Stop Me Now", "Somebody to Love", "Under Pressure"],
    "R.E.M.": ["Losing My Religion"],
    "Radiohead": ["Creep", "Karma Police"],
    "Rick Astley": ["Never Gonna Give You Up"],
    "Robbie Williams": ["Angels"],
    "Sabrina Carpenter": ["Espresso", "Please Please Please"],
    "Shania Twain": ["Man! I Feel Like a Woman!", "You're Still the One"],
    "Spice Girls": ["Wannabe"],
    "Stevie Wonder": ["Superstition", "Signed, Sealed, Delivered"],
    "Sugar Ray": ["Every Morning"],
    "Taylor Swift": ["Shake It Off", "Love Story", "You Belong with Me", "Cruel Summer"],
    "Tears for Fears": ["Everybody Wants to Rule the World"],
    "Tina Turner": ["What's Love Got to Do with It", "The Best"],
    "Toto": ["Africa", "Hold the Line"],
    "U2": ["With or Without You"],
    "Usher": ["Yeah!"],
    "Vengaboys": ["Boom, Boom, Boom, Boom!!"],
    "The Verve": ["Bitter Sweet Symphony"],
    "Weezer": ["Buddy Holly", "Say It Ain't So"],
    "The Weeknd": ["Blinding Lights"],
    "Wheatus": ["Teenage Dirtbag"],
    "Whitney Houston": ["I Wanna Dance with Somebody", "I Will Always Love You"],
    "Yeah Yeah Yeahs": ["Maps"],
  };

  // Leading articles stripped for filing: "The Beatles" lives under B.
  const sortKey = (name) => name.replace(/^(the|a|an)\s+/i, "").toLowerCase();
  const letterOf = (name) => {
    const c = sortKey(name)[0].toUpperCase();
    return c >= "A" && c <= "Z" ? c : "#";
  };
  const ARTISTS = Object.keys(RAW)
    .sort((a, b) => sortKey(a).localeCompare(sortKey(b), undefined, { numeric: true }))
    .map((name) => ({ name, letter: letterOf(name), songs: RAW[name] }));
  const LETTERS = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  const firstArtistOf = {};
  ARTISTS.forEach((a, i) => { if (!(a.letter in firstArtistOf)) firstArtistOf[a.letter] = i; });

  // ---------------- placeholder artwork ----------------
  // Stand-ins for real images: a colour per name. Artists are round "photos",
  // songs are square "album covers". Some return null to show the no-image
  // fallback, since real coverage will have gaps (image_status "not_found").
  const hash = (str) => {
    let h = 2166136261;
    for (const ch of str) h = Math.imul(h ^ ch.codePointAt(0), 16777619);
    return h >>> 0;
  };
  const initial = (name) => (name.replace(/^(the|a|an)\s+/i, "").replace(/^[^\p{L}\p{N}]+/u, "")[0] || "#").toUpperCase();
  function artistArt(name) {
    const h = hash(name);
    if (h % 4 === 0) return null;
    const a = h % 360, b = (a + 50) % 360;
    return `radial-gradient(circle at 50% 36%, hsl(${b} 40% 10% / .55) 0 17%, transparent 17.5%),
      radial-gradient(ellipse 34% 26% at 50% 94%, hsl(${b} 40% 10% / .55) 0 98%, transparent 100%),
      radial-gradient(circle at 25% 20%, hsl(${a} 90% 72% / .7), transparent 55%),
      linear-gradient(160deg, hsl(${a} 65% 45%), hsl(${b} 70% 18%))`;
  }
  function songArt(artist, songIdx) {
    // Pairs of songs share an "album", like a real library.
    const h = hash(artist + "#" + Math.floor(songIdx / 2));
    if (h % 5 === 0) return null;
    const a = h % 360, b = (a + 140) % 360;
    return `radial-gradient(circle at 70% 30%, hsl(${b} 90% 70% / .8), transparent 45%),
      repeating-linear-gradient(45deg, transparent 0 14px, hsl(${a} 60% 10% / .3) 14px 28px),
      linear-gradient(135deg, hsl(${a} 75% 50%), hsl(${b} 70% 20%))`;
  }
  function thumbArt(artist, song) {
    // A YouTube-style frame: dark stage, a light, the singer. Not every song has one.
    const h = hash("yt:" + artist + song);
    if (h % 6 === 0) return null;
    const a = h % 360;
    return `radial-gradient(ellipse 18% 40% at ${30 + (h % 40)}% 70%, hsl(${a} 30% 8% / .9) 0 60%, transparent 62%),
      radial-gradient(ellipse 60% 70% at 50% 0%, hsl(${(a + 30) % 360} 90% 75% / .55), transparent 70%),
      linear-gradient(180deg, hsl(${a} 50% 22%), hsl(${a} 40% 8%))`;
  }

  // Made-up metadata in the shape of the real Song type: album, year, duration,
  // vocalRangeLow/High, which lyrics exist, itunesExplicit. Some fields are left
  // empty on purpose, since real songs have gaps too.
  const ALBUMS = {
    "Fleetwood Mac": [["Rumours", 1977], ["Rumours", 1977], ["Rumours", 1977], ["Fleetwood Mac", 1975], ["Fleetwood Mac", 1975], ["Tango in the Night", 1987]],
    "Queen": [["A Night at the Opera", 1975], ["Jazz", 1978], ["A Day at the Races", 1976], ["Hot Space", 1982]],
    "The Killers": [["Hot Fuss", 2004], ["Hot Fuss", 2004], ["Sam's Town", 2006]],
    "Taylor Swift": [["1989", 2014], ["Fearless", 2008], ["Fearless", 2008], ["Lover", 2019]],
  };
  const LOWS = ["E2", "G2", "A2", "C3", "D3", "F3", "G3", "A3"];
  const HIGHS = ["D4", "F4", "G4", "A4", "C5", "D5", "E5", "G5"];
  function songInfo(artist, idx) {
    const title = RAW[artist][idx];
    const h = hash("meta:" + artist + title);
    const alb = (ALBUMS[artist] || [])[idx];
    const secs = 150 + (h % 180);
    const hasRange = h % 5 !== 0;
    const lyrics = ["Word-synced", "Word-synced", "Synced", "Synced", "Synced", "Plain lyrics"][h % 6];
    return {
      title, artist,
      album: alb ? alb[0] : null,
      year: alb ? alb[1] : (h % 3 === 0 ? null : 1970 + (h % 55)),
      length: `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`,
      range: hasRange ? `${LOWS[h % LOWS.length]}–${HIGHS[(h >> 3) % HIGHS.length]}` : null,
      lyrics,
      explicit: h % 11 === 0,
      backingVocals: h % 4 !== 0,
    };
  }

  function paint(el, css, label) {
    el.classList.toggle("none", !css);
    el.style.background = css || "";
    el.textContent = css ? "" : initial(label);
  }

  // ---------------- state ----------------
  // The letter cursor is never stored: it is a projection of the artist cursor.
  const state = {
    col: 1,          // 0 letters, 1 artists, 2 songs
    artist: ARTISTS.findIndex((a) => a.name === "Fleetwood Mac"),
    song: 0,
    confirmOpen: false,
    choice: 0,
  };

  // ---------------- tuning ----------------
  const DEFAULTS = { gap: 110, radius: 1100, turn: 320, side: 0.45, ramp: 36, art: "head", backdrop: true, info: true };
  let tune = { ...DEFAULTS };
  try { Object.assign(tune, JSON.parse(localStorage.getItem("song-wheel-tune") || "{}")); } catch (e) {}
  const saveTune = () => { try { localStorage.setItem("song-wheel-tune", JSON.stringify(tune)); } catch (e) {} };
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------------- elements ----------------
  const $ = (s) => document.querySelector(s);
  const viewport = $("#viewport"), tv = $("#tv"), ring = $("#ring");
  const cols = [...document.querySelectorAll(".col")];
  const strips = cols.map((c) => c.querySelector(".strip"));
  const bands = cols.map((c) => c.querySelector(".band"));
  const COL_W = [130, 560, 620];

  // Where each column sits on the cylinder, in degrees, with artists at 0.
  // Neighbours are spaced by their real widths plus the gap, measured along the
  // curve, so a narrow column sits close instead of taking an equal slice.
  function seats() {
    const deg = (px) => (px / tune.radius) * (180 / Math.PI);
    const left = deg(COL_W[0] / 2 + COL_W[1] / 2 + tune.gap);
    const right = deg(COL_W[1] / 2 + COL_W[2] / 2 + tune.gap);
    return [-left, 0, right];
  }
  const ROW_H = [72, 64, 66];

  // ---------------- geometry ----------------
  function fit() {
    const s = Math.min(viewport.clientWidth / 1600, viewport.clientHeight / 900);
    tv.style.transform = `translate(-50%, -50%) scale(${s})`;
  }

  function placeColumns() {
    document.documentElement.style.setProperty("--turn-ms", (reducedMotion ? 0 : tune.turn) + "ms");
    document.documentElement.style.setProperty("--side-bright", tune.side);
    cols.forEach((c, i) => {
      c.style.width = COL_W[i] + "px";
      c.style.left = -COL_W[i] / 2 + "px";
    });
    bands.forEach((b, i) => { b.style.height = ROW_H[i] * 1.6 + "px"; });
    turnRing();
  }

  function turnRing() {
    // Pull the ring back by its radius so the front column sits at z=0 (true size),
    // then rotate so the active column faces the viewer.
    const seat = seats();
    const ringAngle = -seat[state.col];
    ring.style.transform = `translateZ(${-tune.radius}px) rotateY(${ringAngle}deg)`;
    // Each column rides the cylinder, then un-rotates by its angle to the viewer so
    // its text always faces forward (a billboard).
    cols.forEach((c, i) => {
      c.style.transform = `rotateY(${seat[i]}deg) translateZ(${tune.radius}px) rotateY(${-(seat[i] + ringAngle)}deg)`;
    });
  }

  // ---------------- rendering ----------------
  const lists = () => [
    LETTERS.map((L) => ({ label: L, empty: !(L in firstArtistOf) })),
    ARTISTS.map((a) => ({ label: a.name, count: a.songs.length })),
    ARTISTS[state.artist].songs.map((t, i) => ({ label: t, n: i + 1 })),
  ];
  const cursors = () => [LETTERS.indexOf(ARTISTS[state.artist].letter), state.artist, state.song];

  let renderedSongsFor = -1;
  function buildStrip(i, items) {
    const h = ROW_H[i];
    strips[i].innerHTML = "";
    items.forEach((it, idx) => {
      const el = document.createElement("div");
      el.className = "item" + (it.empty ? " empty" : "");
      el.style.top = idx * h + "px";
      el.style.height = h + "px";
      el.dataset.idx = idx;
      if (i === 2) el.innerHTML = `<span class="n">${it.n}</span><i class="chip art album"></i><span></span>`;
      else if (i === 1) el.innerHTML = `<i class="chip art artist"></i><span></span><span class="count">${it.count}</span>`;
      else el.innerHTML = `<span></span>`;
      el.querySelector("span:not(.n):not(.count)").textContent = it.label;
      strips[i].appendChild(el);
    });
  }

  function render() {
    const L = lists(), C = cursors();
    if (renderedSongsFor !== state.artist) {
      buildStrip(2, L[2]);
      renderedSongsFor = state.artist;
      cols[2].querySelector(".artist-name").textContent = ARTISTS[state.artist].name;
      $("#headArt").classList.add("pending");
    }
    for (let i = 0; i < 3; i++) {
      const h = ROW_H[i];
      strips[i].style.transform = `translateY(${-C[i] * h - h / 2}px)`;
      [...strips[i].children].forEach((el, idx) => {
        const d = Math.abs(idx - C[i]);
        el.classList.toggle("cur", d === 0);
        const base = el.classList.contains("empty") ? 0.55 : 1;
        el.style.opacity = d === 0 ? 1 : Math.max(0.12, base * (0.8 - d * 0.1));
      });
      cols[i].classList.toggle("active", i === state.col);
      // Each step away from the front multiplies the dimming: one back is the
      // side brightness, two back is that squared.
      cols[i].style.opacity = Math.pow(tune.side, Math.abs(i - state.col));
    }
    turnRing();

    const a = ARTISTS[state.artist];
    const parts = [`<span>Artists</span>`, `<span class="sep">▸</span>`, `<b>${a.letter}</b>`];
    if (state.col >= 1) parts.push(`<span class="sep">▸</span>`, `<b></b>`);
    const crumbs = $("#crumbs");
    crumbs.innerHTML = parts.join("");
    if (state.col >= 1) crumbs.lastElementChild.textContent = a.name;

    renderLegend();
    renderConfirm();
    document.querySelectorAll(".chip.show").forEach((c) => c.classList.remove("show"));
    const info = $("#info");
    info.classList.toggle("open", state.col === 2 && !state.confirmOpen);
    if (infoFor !== state.artist + ":" + state.song) info.classList.add("pending");
    scheduleArt();
  }

  // ---------------- artwork timing ----------------
  // Images only change once the cursor settles. While ▲▼ is held, rows go by far
  // too fast for images to load, so nothing is requested until the key is let go.
  let artTimer, headFor = -1, backdropCss = null, bdLayer = 0, infoFor = null;
  function scheduleArt() {
    clearTimeout(artTimer);
    artTimer = setTimeout(applyArt, 150);
  }
  function applyArt() {
    if (hold) return;
    const a = ARTISTS[state.artist];
    const onSong = state.col === 2 || state.confirmOpen;
    const css = onSong ? songArt(a.name, state.song) : artistArt(a.name);

    if (headFor !== state.artist) {
      paint($("#headArt"), artistArt(a.name), a.name);
      headFor = state.artist;
    }
    $("#headArt").classList.remove("pending");

    if ((tune.art === "row" || tune.art === "both") && state.col > 0 && !state.confirmOpen) {
      const cur = strips[state.col].querySelector(".item.cur .chip");
      if (cur) {
        paint(cur, css, onSong ? a.songs[state.song] : a.name);
        cur.classList.add("show");
      }
    }

    renderInfo();

    if (css !== backdropCss) {
      const layers = document.querySelectorAll(".backdrop .bd");
      layers.forEach((l) => l.classList.remove("on"));
      if (css) {
        bdLayer = 1 - bdLayer;
        layers[bdLayer].style.background = css;
        layers[bdLayer].classList.add("on");
      }
      backdropCss = css;
    }
  }

  function renderInfo() {
    const key = state.artist + ":" + state.song;
    $("#info").classList.remove("pending");
    if (infoFor === key) return;
    infoFor = key;
    const a = ARTISTS[state.artist];
    const m = songInfo(a.name, state.song);
    paint($("#iThumb"), thumbArt(a.name, m.title), "");
    if (!$("#iThumb").style.background) $("#iThumb").textContent = "No video still";
    paint($("#iCover"), songArt(a.name, state.song), m.title);
    $("#iTitle").textContent = m.title;
    $("#iArtist").textContent = m.artist;
    $("#iAlbum").textContent = m.album || "";
    $("#iAlbum").hidden = !m.album;
    const fact = (id, v) => { $(id).textContent = v || "—"; $(id).classList.toggle("unknown", !v); };
    fact("#iLen", m.length);
    fact("#iRange", m.range);
    fact("#iYear", m.year);
    const tags = [[m.lyrics, m.lyrics === "Plain lyrics" ? "dim" : ""]];
    if (m.backingVocals) tags.push(["Backing vocals", ""]);
    if (m.explicit) tags.push(["Explicit", "warn"]);
    $("#iTags").innerHTML = "";
    tags.forEach(([t, cls]) => {
      const el = document.createElement("span");
      el.className = "tag " + cls;
      el.textContent = t;
      $("#iTags").appendChild(el);
    });
  }

  function applyArtSettings() {
    document.body.classList.toggle("info-on", tune.info);
    document.body.dataset.art = tune.art;
    document.body.classList.toggle("backdrop-on", tune.backdrop);
  }

  function renderLegend() {
    let keys;
    if (state.confirmOpen) {
      keys = [["◀ ▶", "Choose"], ["⏎", "Confirm"], ["⌫", "Cancel"]];
    } else {
      const upDown = ["Jump letter", "Browse artists", "Browse songs"][state.col];
      const enter = ["Go to artists", "See songs", "Pick song"][state.col];
      keys = [["▲ ▼", upDown], ["◀ ▶", "Change column"], ["⏎", enter], ["⌫", state.col === 2 ? "Back to artists" : "Back to the song"]];
    }
    $("#legend").innerHTML = keys.map(([k, t]) =>
      `<div class="k">${k.split(" ").map((x) => `<kbd>${x}</kbd>`).join("")}<span>${t}</span></div>`).join("");
  }

  function renderConfirm() {
    $("#confirm").classList.toggle("open", state.confirmOpen);
    if (state.confirmOpen) {
      const a = ARTISTS[state.artist];
      $("#cTitle").textContent = a.songs[state.song];
      $("#cArtist").textContent = a.name;
      paint($("#cArt"), songArt(a.name, state.song), a.songs[state.song]);
    }
    document.querySelectorAll(".choice").forEach((b, i) => b.classList.toggle("cur", i === state.choice));
  }

  let toastTimer;
  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------------- actions ----------------
  function setArtist(i) {
    const next = Math.max(0, Math.min(ARTISTS.length - 1, i));
    if (next !== state.artist) { state.artist = next; state.song = 0; }
  }

  function move(dir) {
    if (state.confirmOpen) return;
    if (state.col === 0) {
      // Letters: skip the greyed-out empty ones, land on that letter's first artist.
      let li = LETTERS.indexOf(ARTISTS[state.artist].letter);
      for (let j = li + dir; j >= 0 && j < LETTERS.length; j += dir) {
        if (LETTERS[j] in firstArtistOf) { setArtist(firstArtistOf[LETTERS[j]]); break; }
      }
    } else if (state.col === 1) {
      setArtist(state.artist + dir);
    } else {
      const n = ARTISTS[state.artist].songs.length;
      state.song = Math.max(0, Math.min(n - 1, state.song + dir));
    }
    render();
  }

  function turn(dir) {
    if (state.confirmOpen) { state.choice = dir < 0 ? 0 : 1; render(); return; }
    // Left at the leftmost column does nothing on purpose.
    state.col = Math.max(0, Math.min(2, state.col + dir));
    render();
  }

  function confirm() {
    if (state.confirmOpen) {
      const song = ARTISTS[state.artist].songs[state.song];
      state.confirmOpen = false;
      toast(state.choice === 0 ? `Would start “${song}” now` : `Would add “${song}” to the queue`);
    } else if (state.col < 2) {
      state.col += 1;
    } else {
      state.confirmOpen = true;
      state.choice = 0;
    }
    render();
  }

  function back() {
    if (state.confirmOpen) state.confirmOpen = false;
    else if (state.col === 2) state.col = 1;
    else toast("Back here would return to the song that's playing");
    render();
  }

  // ---------------- keyboard, with a hold-to-scroll ramp ----------------
  let hold = null;
  function stopHold() {
    if (hold) clearTimeout(hold.timer);
    const wasHolding = !!hold;
    hold = null;
    strips.forEach((s) => s.style.removeProperty("--scroll-ms"));
    if (wasHolding) scheduleArt();
  }
  function startHold(key, dir) {
    stopHold();
    move(dir);
    hold = { key, dir, t0: performance.now() };
    const tick = () => {
      const held = performance.now() - hold.t0 - 350;
      // ~8 per second, rising to the tuned top speed over about a second.
      const rate = 8 + Math.min(1, Math.max(0, held) / 1100) * (tune.ramp - 8);
      const ms = 1000 / rate;
      strips.forEach((s) => s.style.setProperty("--scroll-ms", Math.min(160, ms * 0.9) + "ms"));
      move(dir);
      hold.timer = setTimeout(tick, ms);
    };
    hold.timer = setTimeout(tick, 350);
  }

  viewport.addEventListener("keydown", (e) => {
    if (e.target.closest && e.target.closest(".tune")) return;
    const k = e.key;
    const handled = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Enter", "Backspace", "Escape"].includes(k);
    if (!handled) return;
    e.preventDefault();
    if (e.repeat) return; // our own ramp handles held keys
    if (k === "ArrowUp") startHold(k, -1);
    else if (k === "ArrowDown") startHold(k, 1);
    else if (k === "ArrowLeft") turn(-1);
    else if (k === "ArrowRight") turn(1);
    else if (k === "Enter") confirm();
    else back();
  });
  viewport.addEventListener("keyup", (e) => { if (hold && e.key === hold.key) stopHold(); });
  window.addEventListener("blur", stopHold);

  // ---------------- mouse ----------------
  // The scroll wheel spins whichever column the pointer is over.
  const wheelAcc = [0, 0, 0];
  cols.forEach((c, i) => {
    c.addEventListener("wheel", (e) => {
      e.preventDefault();
      if (state.confirmOpen) return;
      if (state.col !== i) { state.col = i; render(); }
      wheelAcc[i] += e.deltaY;
      const step = e.deltaMode === 1 ? 1 : 50;
      while (Math.abs(wheelAcc[i]) >= step) {
        const dir = Math.sign(wheelAcc[i]);
        wheelAcc[i] -= dir * step;
        move(dir);
      }
    }, { passive: false });

    c.addEventListener("click", (e) => {
      if (state.confirmOpen) return;
      if (state.col !== i) { state.col = i; render(); return; }
      const item = e.target.closest(".item");
      if (!item) return;
      const idx = +item.dataset.idx;
      if (i === 0) {
        const L = LETTERS[idx];
        if (L in firstArtistOf) { setArtist(firstArtistOf[L]); state.col = 1; }
      } else if (i === 1) {
        if (idx === state.artist) state.col = 2; else setArtist(idx);
      } else {
        if (idx === state.song) { state.confirmOpen = true; state.choice = 0; } else state.song = idx;
      }
      render();
    });
  });

  document.querySelectorAll(".choice").forEach((b, i) => {
    b.addEventListener("mouseenter", () => { state.choice = i; renderConfirm(); });
    b.addEventListener("click", () => { state.choice = i; confirm(); viewport.focus(); });
  });
  $("#confirm").addEventListener("click", (e) => { if (e.target.id === "confirm") back(); });

  // ---------------- focus hint ----------------
  const hint = $("#focusHint");
  const updateHint = () => hint.classList.toggle("hidden", document.hasFocus() && viewport.contains(document.activeElement));
  viewport.addEventListener("focus", updateHint);
  viewport.addEventListener("blur", updateHint);
  window.addEventListener("focus", updateHint);
  window.addEventListener("blur", updateHint);
  viewport.addEventListener("mousedown", (e) => {
    if (!e.target.closest(".tune, .tune-btn")) setTimeout(() => { viewport.focus(); updateHint(); });
  });

  // ---------------- tuning panel ----------------
  const bind = (id, key, fmt) => {
    const input = $("#t" + id), out = $("#o" + id);
    const sync = () => { input.value = tune[key]; out.textContent = fmt(tune[key]); };
    input.addEventListener("input", () => { tune[key] = +input.value; out.textContent = fmt(tune[key]); saveTune(); placeColumns(); render(); });
    return sync;
  };
  const syncs = [
    bind("Gap", "gap", (v) => v + "px"),
    bind("Radius", "radius", (v) => v + "px"),
    bind("Turn", "turn", (v) => v + "ms"),
    bind("Side", "side", (v) => Math.round(v * 100) + "%"),
    bind("Ramp", "ramp", (v) => v + " rows/s"),
  ];
  syncs.forEach((f) => f());
  const syncArt = () => { $("#tArt").value = tune.art; $("#tBackdrop").checked = tune.backdrop; $("#tInfo").checked = tune.info; applyArtSettings(); };
  $("#tInfo").addEventListener("change", (e) => {
    tune.info = e.target.checked; saveTune(); applyArtSettings();
  });
  $("#tArt").addEventListener("change", (e) => {
    tune.art = e.target.value; saveTune(); applyArtSettings(); render();
  });
  $("#tBackdrop").addEventListener("change", (e) => {
    tune.backdrop = e.target.checked; saveTune(); applyArtSettings();
  });
  syncArt();
  $("#tuneBtn").addEventListener("click", () => {
    const open = $("#tune").classList.toggle("open");
    $("#tuneBtn").textContent = open ? "Close tuning" : "Tune the wheel";
  });
  $("#tReset").addEventListener("click", () => {
    tune = { ...DEFAULTS }; saveTune(); syncs.forEach((f) => f()); syncArt(); placeColumns(); render(); viewport.focus();
  });

  // ---------------- boot ----------------
  buildStrip(0, lists()[0]);
  buildStrip(1, lists()[1]);
  fit();
  placeColumns();
  render();
  window.addEventListener("resize", fit);
  viewport.focus();
  updateHint();
})();
</script>
</body>
</html>
