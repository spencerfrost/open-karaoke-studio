# Open Karaoke Studio - Docker Compose
# For deployment with optimized builds
# Development is done locally via: ./scripts/dev-tmux.sh

services:
  # Redis for Celery message broker
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    networks:
      - karaoke-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      # This machine only, for debugging and backups; other hosts can't reach it
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karaoke}
      POSTGRES_USER: ${POSTGRES_USER:-karaoke_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karaoke_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karaoke_user} -d ${POSTGRES_DB:-karaoke}"]
      interval: 2s
      timeout: 2s
      retries: 3
      start_period: 1s
    networks:
      - karaoke-network

  # FastAPI Backend API (unified API + WebSockets)
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - "15123:5123"
    volumes:
      - ./karaoke_library:/app/karaoke_library
      - ./secrets:/app/secrets:ro
      - backend_logs:/app/backend/logs
    environment:
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # First admin, created on startup only while no admin exists.
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-karaoke_user}:${POSTGRES_PASSWORD:-karaoke_pass}@postgres:5432/${POSTGRES_DB:-karaoke}
      - LIBRARY_DIR=/app/karaoke_library
      - CORS_ORIGINS=${CORS_ORIGINS}
      # Trust X-Forwarded-For from the bundled nginx only (its pinned address
      # below), so per-IP rate limits see the visitor rather than nginx, and a
      # direct caller on :15123 can't fake the header.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-${KARAOKE_PROXY_IP:-172.30.250.10}}
      - DISCOGS_TOKEN=${DISCOGS_TOKEN}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-/app/secrets/yt-cookies.txt}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5123/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - karaoke-network

  # Celery Worker for audio processing
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 10s
    # Three workers (audio, lyrics, enrichment), each in a restart loop; see the script
    command: ./celery_workers.sh
    volumes:
      - ./karaoke_library:/app/karaoke_library
      - ./secrets:/app/secrets:ro
      - backend_logs:/app/backend/logs
      # Demucs weights (torch hub) and the torch.compile kernel cache; without it a
      # recreated container re-downloads the weights and recompiles the Roformers
      - torch_cache:/root/.cache/torch
    environment:
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torch/inductor
      - CELERY_BROKER_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-karaoke_user}:${POSTGRES_PASSWORD:-karaoke_pass}@postgres:5432/${POSTGRES_DB:-karaoke}
      - LIBRARY_DIR=/app/karaoke_library
      - CELERY_LOG_LEVEL=warning
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - OMP_NUM_THREADS=1
      - DISCOGS_TOKEN=${DISCOGS_TOKEN}
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY}
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-/app/secrets/yt-cookies.txt}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    # Runs on the CPU here; docker-compose.gpu.yml gives it an NVIDIA GPU.
    # Lower the limits in .env on a smaller machine.
    deploy:
      resources:
        limits:
          cpus: '${CELERY_CPU_LIMIT:-4}'
          memory: ${CELERY_MEMORY_LIMIT:-12G}
    networks:
      - karaoke-network

  # Frontend Production Server (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Link for the entry page's "Watch the demo" button; hidden when empty.
        VITE_DEMO_RECORDING_URL: ${VITE_DEMO_RECORDING_URL:-}
        # Docs site the guided tour's "how this works" links point to; hidden when empty.
        VITE_DOCS_URL: ${VITE_DOCS_URL:-}
    restart: unless-stopped
    stop_grace_period: 5s
    ports:
      - "5192:5192"
    depends_on:
      api:
        condition: service_healthy
    networks:
      karaoke-network:
        # Pinned: the API trusts X-Forwarded-For from this address only
        # (FORWARDED_ALLOW_IPS on the api service). Must sit inside KARAOKE_SUBNET.
        ipv4_address: ${KARAOKE_PROXY_IP:-172.30.250.10}

volumes:
  redis_data:
  postgres_data:
  backend_logs:
  torch_cache:

networks:
  karaoke-network:
    driver: bridge
    # Fixed so nginx can have a pinned address. Change KARAOKE_SUBNET and
    # KARAOKE_PROXY_IP in .env if it clashes with another Docker network.
    ipam:
      config:
        - subnet: ${KARAOKE_SUBNET:-172.30.250.0/24}
