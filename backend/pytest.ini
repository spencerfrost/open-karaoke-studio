[pytest]
testpaths = tests
norecursedirs = scripts
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

# Add backend/ to sys.path for all tests
pythonpath = .
