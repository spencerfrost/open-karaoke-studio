<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Controls Test - FastAPI WebSocket</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
        }
        .control-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
        }
        .control-group {
            margin: 15px 0;
        }
        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .slider {
            width: 100%;
            height: 25px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            margin: 10px 0;
        }
        .slider::-webkit-slider-thumb {
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #ff6b6b;
            cursor: pointer;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .status.connected {
            background: rgba(0, 255, 136, 0.2);
            border: 1px solid #00ff88;
        }
        .status.disconnected {
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
        }
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .playback-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .state-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎛️ Performance Controls Test</h1>
        
        <div class="control-section">
            <h2>Connection Status</h2>
            <div id="connection-status" class="status disconnected">❌ Disconnected</div>
            <button onclick="connect()" id="connect-btn">Connect to Performance WebSocket</button>
            <button onclick="disconnect()" id="disconnect-btn" disabled>Disconnect</button>
        </div>

        <div class="control-section">
            <h2>🎵 Audio Controls</h2>
            
            <div class="control-group">
                <label for="vocal-volume">Vocal Volume: <span id="vocal-value">0</span></label>
                <input type="range" id="vocal-volume" class="slider" min="-1" max="1" step="0.1" value="0">
            </div>
            
            <div class="control-group">
                <label for="instrumental-volume">Instrumental Volume: <span id="instrumental-value">1</span></label>
                <input type="range" id="instrumental-volume" class="slider" min="0" max="2" step="0.1" value="1">
            </div>
        </div>

        <div class="control-section">
            <h2>📝 Lyrics Controls</h2>
            
            <div class="control-group">
                <label for="lyrics-size">Lyrics Size:</label>
                <select id="lyrics-size" style="padding: 8px; border-radius: 5px; background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.3);">
                    <option value="small">Small</option>
                    <option value="medium" selected>Medium</option>
                    <option value="large">Large</option>
                    <option value="extra-large">Extra Large</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="lyrics-offset">Lyrics Offset: <span id="offset-value">0</span>ms</label>
                <input type="range" id="lyrics-offset" class="slider" min="-5000" max="5000" step="100" value="0">
            </div>
        </div>

        <div class="control-section">
            <h2>⏯️ Playback Controls</h2>
            
            <div class="playback-controls">
                <button onclick="sendPlay()" id="play-btn">▶️ Play</button>
                <button onclick="sendPause()" id="pause-btn">⏸️ Pause</button>
                <button onclick="resetPlayer()" id="reset-btn">🔄 Reset</button>
            </div>
            
            <div class="control-group">
                <label for="current-time">Current Time: <span id="time-value">0</span>s</label>
                <input type="range" id="current-time" class="slider" min="0" max="300" step="1" value="0">
            </div>
            
            <div class="control-group">
                <label for="duration">Duration: <span id="duration-value">0</span>s</label>
                <input type="range" id="duration" class="slider" min="0" max="600" step="1" value="0">
            </div>
        </div>

        <div class="control-section">
            <h2>📊 Current State</h2>
            <div id="state-display" class="state-display">No state received yet...</div>
        </div>

        <div class="control-section">
            <h2>📋 WebSocket Log</h2>
            <button onclick="clearLog()">Clear Log</button>
            <div id="log" class="log">Waiting for connection...</div>
        </div>
    </div>

    <script>
        let ws = null;
        let isConnected = false;

        // DOM elements
        const statusEl = document.getElementById('connection-status');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const logEl = document.getElementById('log');
        const stateEl = document.getElementById('state-display');

        // Control elements
        const vocalSlider = document.getElementById('vocal-volume');
        const instrumentalSlider = document.getElementById('instrumental-volume');
        const lyricsSize = document.getElementById('lyrics-size');
        const lyricsOffset = document.getElementById('lyrics-offset');
        const currentTime = document.getElementById('current-time');
        const duration = document.getElementById('duration');

        // Value display elements
        const vocalValue = document.getElementById('vocal-value');
        const instrumentalValue = document.getElementById('instrumental-value');
        const offsetValue = document.getElementById('offset-value');
        const timeValue = document.getElementById('time-value');
        const durationValue = document.getElementById('duration-value');

        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            logEl.textContent += `[${timestamp}] ${message}\n`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            logEl.textContent = '';
        }

        function updateConnectionStatus(connected) {
            isConnected = connected;
            if (connected) {
                statusEl.className = 'status connected';
                statusEl.textContent = '✅ Connected to Performance WebSocket';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusEl.className = 'status disconnected';
                statusEl.textContent = '❌ Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function updateStateDisplay(state) {
            stateEl.textContent = JSON.stringify(state, null, 2);
        }

        function connect() {
            try {
                ws = new WebSocket('ws://localhost:5124/ws/performance');
                
                ws.onopen = () => {
                    updateConnectionStatus(true);
                    log('🔌 Connected to performance WebSocket');
                    
                    // Join performance controls
                    ws.send(JSON.stringify({
                        type: 'join_performance'
                    }));
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`📨 Received: ${data.type}`);
                    
                    if (data.type === 'performance_state') {
                        updateStateDisplay(data.state);
                        updateControlsFromState(data.state);
                    } else if (data.type === 'control_updated') {
                        log(`🎛️ Control updated: ${data.control} = ${data.value}`);
                        updateSingleControl(data.control, data.value);
                    } else if (data.type === 'playback_play') {
                        log('▶️ Received play command');
                    } else if (data.type === 'playback_pause') {
                        log('⏸️ Received pause command');
                    } else if (data.type === 'reset_player_state') {
                        log('🔄 Received reset command');
                        currentTime.value = 0;
                        timeValue.textContent = '0';
                    } else if (data.type === 'error') {
                        log(`❌ Error: ${data.message}`);
                    }
                };

                ws.onclose = () => {
                    updateConnectionStatus(false);
                    log('🔌 WebSocket connection closed');
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error}`);
                };
            } catch (error) {
                log(`❌ Failed to connect: ${error.message}`);
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
            }
        }

        function updateControlsFromState(state) {
            vocalSlider.value = state.vocal_volume || 0;
            vocalValue.textContent = state.vocal_volume || 0;
            
            instrumentalSlider.value = state.instrumental_volume || 1;
            instrumentalValue.textContent = state.instrumental_volume || 1;
            
            lyricsSize.value = state.lyrics_size || 'medium';
            
            lyricsOffset.value = state.lyrics_offset || 0;
            offsetValue.textContent = state.lyrics_offset || 0;
            
            currentTime.value = state.current_time || 0;
            timeValue.textContent = state.current_time || 0;
            
            duration.value = state.duration || 0;
            durationValue.textContent = state.duration || 0;
        }

        function updateSingleControl(control, value) {
            const element = document.getElementById(control.replace('_', '-'));
            if (element) {
                element.value = value;
                
                // Update display value
                const valueEl = document.getElementById(`${control.replace('_', '-').split('-')[0]}-value`);
                if (valueEl) {
                    valueEl.textContent = value;
                }
            }
        }

        function sendControlUpdate(control, value) {
            if (!isConnected) return;
            
            ws.send(JSON.stringify({
                type: 'update_performance_control',
                control: control,
                value: value
            }));
        }

        function sendPlay() {
            if (!isConnected) return;
            
            ws.send(JSON.stringify({
                type: 'playback_play'
            }));
        }

        function sendPause() {
            if (!isConnected) return;
            
            ws.send(JSON.stringify({
                type: 'playback_pause'
            }));
        }

        function resetPlayer() {
            if (!isConnected) return;
            
            ws.send(JSON.stringify({
                type: 'reset_player_state'
            }));
        }

        function sendPlayerState() {
            if (!isConnected) return;
            
            ws.send(JSON.stringify({
                type: 'update_player_state',
                isPlaying: Math.random() > 0.5, // Random for demo
                currentTime: parseFloat(currentTime.value),
                duration: parseFloat(duration.value)
            }));
        }

        // Event listeners for controls
        vocalSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            vocalValue.textContent = value;
            sendControlUpdate('vocal_volume', value);
        });

        instrumentalSlider.addEventListener('input', (e) => {
            const value = parseFloat(e.target.value);
            instrumentalValue.textContent = value;
            sendControlUpdate('instrumental_volume', value);
        });

        lyricsSize.addEventListener('change', (e) => {
            sendControlUpdate('lyrics_size', e.target.value);
        });

        lyricsOffset.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            offsetValue.textContent = value;
            sendControlUpdate('lyrics_offset', value);
        });

        currentTime.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            timeValue.textContent = value;
            sendPlayerState();
        });

        duration.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            durationValue.textContent = value;
            sendPlayerState();
        });

        // Auto-connect on page load
        window.addEventListener('load', () => {
            log('Performance Controls Test loaded');
        });
    </script>
</body>
</html>
